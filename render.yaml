services:
  - type: web
    name: yugkrit-sih
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile - app:app
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yugkrit-db
          property: connectionString
      - key: WHATSAPP_PROVIDER
        value: cloud_api

databases:
  - name: yugkrit-db
    databaseName: yugkrit
    user: yugkrit
    plan: free
